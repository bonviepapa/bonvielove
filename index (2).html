<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonvie's papa car life | 자동차 계산기</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth;color-scheme:dark}body{margin:0;background:#0b111b;color:#f4f5f7;font:16px/1.65 system-ui,sans-serif}header{background:radial-gradient(ellipse at 90% 10%,#34485c,#101b2b 55%,#0b111b);border-bottom:1px solid #d9b87944;padding:24px 20px 40px}main,.wrap{max-width:1100px;margin:auto}header small,.eyebrow{color:#d9b879;letter-spacing:3px;font-size:11px;font-weight:700}.brand{font-weight:800;font-style:italic;font-size:clamp(18px,4vw,25px);padding-bottom:24px;border-bottom:1px solid #ffffff22;margin-bottom:32px}.gold{color:#e6c68b}h1{font-size:clamp(30px,6vw,52px);line-height:1.25;margin:12px 0}header p{color:#b7c4d4}.hero{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:24px}.hero svg{width:100%;height:auto}.cta{display:inline-block;background:#d9b879;color:#101722;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:800}main{padding:32px 20px}nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0 28px}button{font:inherit;cursor:pointer;border:1px solid #344052;border-radius:12px;background:#151f2d;color:#f4f5f7;padding:16px;text-align:left}nav button{min-height:112px;font-weight:700;line-height:1.4}nav button span{display:block;color:#e6c68b;font-size:25px;margin-bottom:12px}button:hover,button.active{background:#222d3b;border-color:#d9b879}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #e6c68b;outline-offset:3px}section{background:#151f2d;border:1px solid #d9b87955;border-radius:18px;padding:clamp(16px,4vw,32px)}h2{margin:8px 0}#fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}label{display:block;font-weight:600;color:#d3dce6}input{width:100%;padding:12px;border:1px solid #526174;background:#0b111b;border-radius:8px;font:inherit;margin-top:5px;color:white}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-top:24px}.result{background:#d9b87912;border:1px solid #d9b87933;padding:18px;border-radius:12px;color:#c6d0dc}.result strong{display:block;font-size:clamp(21px,4vw,28px);color:#e6c68b;overflow-wrap:anywhere}.note{font-size:14px;color:#b4c0cf}footer{padding:28px 20px;text-align:center;color:#a8b5c5;border-top:1px solid #ffffff20;font-size:13px}a{color:#e6c68b}#reset{margin-top:20px}#error{color:#ffaaaa}@media(max-width:650px){.hero{grid-template-columns:1fr;gap:8px}.hero svg{max-height:115px}nav{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:24px 14px}nav button{padding:13px;min-height:100px;font-size:14px}}</style></head><body><header><div class="wrap"><div class="brand">Bonvie's papa <span class="gold">car life</span></div><div class="hero"><div><small>PREMIUM AUTOMOTIVE TOOLS</small><h1>자동차의 모든 비용,<br><span class="gold">숫자로 현명하게.</span></h1><p>구매부터 유지, 그리고 판매까지.<br>당신의 자동차 생활을 위한 스마트 계산기.</p><a class="cta" href="#calculators">무료 계산기 이용하기 ↓</a></div><svg viewBox="0 0 420 120" aria-hidden="true"><path d="M12 85 Q30 66 78 61 L137 25 Q205 4 269 29 L319 58 Q380 60 401 79 L405 92 L355 92 M310 92 L110 92 M64 92 L15 92Z" fill="#142131" stroke="#d9b879" stroke-width="2.5"/><path d="M98 58 L145 30 Q205 13 260 33 L301 58Z" fill="#314255" stroke="#aab6c4"/><path d="M207 23 L216 58 M15 77 L52 73 M367 71 L399 79" stroke="#d9b879" stroke-width="3"/><g fill="#0b111b" stroke="#65768a" stroke-width="3"><circle cx="87" cy="90" r="22"/><circle cx="333" cy="90" r="22"/></g></svg></div></div></header><main id="calculators"><div class="eyebrow">SMART CALCULATORS</div><h2>자동차 계산기 8종</h2><p class="note">필요한 계산기를 선택해 보세요.</p><nav id="nav" aria-label="계산기 선택"></nav><section><div class="eyebrow">QUICK CALCULATOR</div><h2 id="heading"></h2><p id="desc" class="note"></p><div id="fields"></div><p id="error" role="alert"></p><div id="results" aria-live="polite"></div><button id="reset">기본값으로 초기화</button><p id="note" class="note"></p></section></main><footer>Bonvie's papa car life · <a href="https://blog.naver.com/kingvara0505">네이버 블로그</a><br>모든 결과는 참고용이며 입력값은 서버로 전송되지 않습니다.</footer><script>
const money=n=>Number.isFinite(n)?Math.round(n).toLocaleString('ko-KR')+'원':'계산 불가';const won=n=>money(n*10000);const f=(label,value,max=1e9,min=0)=>({label,value,max,min});const tools=[
['ev','전기차 실구매가','차량 가격에서 구매보조금과 할인액을 차감합니다.',[f('차량 가격 (만원)',5000),f('국고 보조금 (만원)',300),f('지자체 보조금 (만원)',200),f('제조사 할인 (만원)',100),f('가상 생산세액공제 (만원)',250),f('가격 반영률 (%)',0,100)],([p,a,b,c,d,r])=>[['가상 추가 할인',won(d*r/100)],['예상 실구매가',won(Math.max(0,p-a-b-c-d*r/100))]],'생산세액공제는 가정이며 확정 혜택이 아닙니다. 취득세·등록비 제외. 보조금 및 할인 중복 가능 여부를 확인하세요.'],
['loan','자동차 할부','원리금 균등상환 기준입니다.',[f('차량 가격 (만원)',4000),f('선수금 (만원)',1000),f('연 금리 (%)',5,100),f('할부 기간 (개월)',60,600,1)],([p,d,r,n])=>{if(d>p||!Number.isInteger(n))throw Error('선수금과 할부 기간을 확인하세요.');let a=(p-d)*10000,i=r/1200,m=i?a*i/(1-Math.pow(1+i,-n)):a/n;return [['월 납입금',money(m)],['총 이자',money(m*n-a)],['총 지출 (선수금 포함)',money(m*n+d*10000)]]},'수수료·취득세·중도상환 비용 제외. 실제 금융사 계산과 차이가 있을 수 있습니다.'],
['fuel','가솔린·하이브리드 유지비','동일 주행거리와 유가로 연간 연료비를 비교합니다.',[f('연간 주행거리 (km)',15000),f('휘발유 가격 (원/L)',1700),f('가솔린 연비 (km/L)',11,1000,.1),f('하이브리드 연비 (km/L)',17,1000,.1)],([k,p,a,b])=>[['가솔린 연료비',money(k*p/a)],['하이브리드 연료비',money(k*p/b)],['하이브리드 절감액',money(k*p/a-k*p/b)]],'연료비만 비교하며 정비비·보험료는 제외합니다.'],
['depreciation','중고차 감가상각','연간 일정 비율로 가치가 감소한다고 가정합니다.',[f('신차 가격 (만원)',4000),f('연간 감가율 (%)',15,100),f('보유 기간 (년)',3,50)],([p,r,y])=>{let v=p*(1-r/100)**y;return [['예상 중고차 가치',won(v)],['누적 감가액',won(p-v)],['잔존율', (p?v/p*100:0).toFixed(1)+'%']]},'실제 시세 예측이 아닌 복리 감가 모형입니다. 사고·주행거리·시장 수요 미반영.'],
['charge','전기차 충전비','완속·급속 충전 비중을 반영합니다.',[f('월 주행거리 (km)',1250),f('전비 (km/kWh)',5,100,.1),f('완속 단가 (원/kWh)',220),f('급속 단가 (원/kWh)',350),f('급속 충전 비중 (%)',30,100),f('충전 손실률 (%)',10,99)],([k,e,a,b,r,l])=>{let q=k/e/(1-l/100),c=q*(a*(1-r/100)+b*r/100);return [['월 충전량',q.toFixed(1)+' kWh'],['월 충전비',money(c)],['연 충전비',money(c*12)]]},'전비가 배터리 사용량 기준일 때 충전 손실을 적용합니다. 이미 손실이 포함된 전비라면 0%로 입력하세요.'],
['tax','자동차 취등록세','과세표준과 적용 세율을 직접 입력합니다.',[f('취득세 과세표준 (만원)',3500),f('적용 취득세율 (%)',7,100),f('감면액 (만원)',0),f('기타 등록 비용 (만원)',10)],([p,r,d,c])=>[['감면 전 취득세',won(p*r/100)],['예상 취득세',won(Math.max(0,p*r/100-d))],['예상 등록 관련 비용',won(Math.max(0,p*r/100-d)+c)]],'비영업용 일반 승용차 7%를 예시로 설정했습니다. 차종별 세율·감면·과세표준 및 공채 비용은 관할 기관에서 확인하세요.'],
['total','자동차 5년 총유지비','구매가에서 5년 후 잔존가치를 빼고 비용을 합산합니다.',[f('실구매가 (만원)',4000),f('5년 후 판매가 (만원)',2000),f('초기 등록 비용 (만원)',250),f('연 보험료 (만원)',80),f('연 자동차세 (만원)',30),f('연 연료·충전비 (만원)',150),f('연 정비비 (만원)',50),f('5년 총 금융 이자 (만원)',0)],([p,v,t,a,b,c,d,i])=>{let s=p-v+t+5*(a+b+c+d)+i;return [['5년 총보유비용',won(s)],['월 평균 비용',won(s/60)],['차량 감가액',won(p-v)]]},'주차비·통행료 등은 제외합니다. 할부 원금은 구매가에 포함되어 중복 계산하지 않습니다.'],
['break','하이브리드 손익분기점','추가 구매 비용을 연료비 절감으로 회수하는 기간입니다.',[f('하이브리드 추가 가격 (만원)',400),f('연간 주행거리 (km)',15000),f('휘발유 가격 (원/L)',1700),f('가솔린 연비 (km/L)',11,1000,.1),f('하이브리드 연비 (km/L)',17,1000,.1)],([d,k,p,a,b])=>{let s=k*p*(1/a-1/b);return [['연간 연료비 절감',money(s)],['회수 기간',d===0?'즉시':s>0?(d*10000/s).toFixed(1)+'년':'회수 불가'],['회수 주행거리',d===0?'0 km':s>0?Math.round(d*10000/s*k).toLocaleString()+' km':'회수 불가']]},'연료비 기준 단순 비교입니다. 세금·금융비용·잔존가치 차이는 제외합니다.']];
const $=id=>document.getElementById(id);let current;function render(id){current=tools.find(t=>t[0]===id)||tools[0];$('heading').textContent=current[1];$('desc').textContent=current[2];$('note').textContent=current[5];$('fields').replaceChildren();current[3].forEach((x,i)=>{let l=document.createElement('label');l.textContent=x.label;let a=document.createElement('input');a.type='number';a.inputMode='decimal';a.min=x.min;a.max=x.max;a.step='any';a.value=x.value;a.addEventListener('input',calc);l.append(a);$('fields').append(l)});document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.id===current[0]);b.setAttribute('aria-pressed',String(b.dataset.id===current[0]))});calc()}function calc(){let a=[...$('fields').querySelectorAll('input')];$('results').replaceChildren();$('error').textContent='';if(a.some(x=>x.value===''||!x.validity.valid||!Number.isFinite(x.valueAsNumber))){$('error').textContent='입력 범위에 맞는 숫자를 입력하세요.';return}try{current[4](a.map(x=>x.valueAsNumber)).forEach(([k,v])=>{let d=document.createElement('div');d.className='result';d.textContent=k;let s=document.createElement('strong');s.textContent=v;d.append(s);$('results').append(d)})}catch(e){$('error').textContent=e.message}}tools.forEach(t=>{let b=document.createElement('button');let icon=document.createElement('span');icon.setAttribute('aria-hidden','true');icon.textContent=({'ev':'⚡','loan':'%','fuel':'⛽','depreciation':'↘','charge':'▣','tax':'₩','total':'◈','break':'◎'})[t[0]];b.append(icon,document.createTextNode(t[1]));b.dataset.id=t[0];b.onclick=()=>{location.hash=t[0];render(t[0])};$('nav').append(b)});window.addEventListener('hashchange',()=>{if(location.hash!=='#calculators')render(location.hash.slice(1))});$('reset').onclick=()=>render(current[0]);render(location.hash.slice(1));</script></body></html>
